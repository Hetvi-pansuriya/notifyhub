<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotifyHub · Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #e8ecf8;
            background:
                radial-gradient(circle at 20% 15%, rgba(91, 140, 255, .18), transparent 45%),
                radial-gradient(circle at 80% 85%, rgba(139, 92, 246, .18), transparent 45%),
                #0b1020;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(91, 140, 255, .12);
            border: 1px solid #222b4a;
            font-size: 13px;
            color: #9aa4c4;
            margin-bottom: 24px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fbbf24;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(251, 191, 36, .6);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(251, 191, 36, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(251, 191, 36, 0);
            }
        }

        h1 {
            font-size: clamp(40px, 9vw, 68px);
            letter-spacing: -1.5px;
            background: linear-gradient(90deg, #5b8cff, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            margin-top: 14px;
            font-size: 18px;
            color: #9aa4c4;
        }
    </style>
</head>

<body>
    <main>
        <div class="badge"><span class="dot"></span> Under development</div>
        <h1>NotifyHub</h1>
        <p>Coming soon. This project is currently being built.</p>
    </main>
</body>

</html>
